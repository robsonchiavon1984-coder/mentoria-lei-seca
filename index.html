<style>
:root{--bg:#f4f1ea;--surface:#fffdf8;--surface2:#efeadf;--ink:#1c2128;--muted:#646b74;--line:#ddd6c8;--accent:#1e3a5f;--accent-ink:#ffffff;--accent-soft:#e3e9f1;--gold:#9c7726;--ok:#2f7d4f;--ok-bg:#e2f1e7;--err:#b23b3b;--err-bg:#f8e2df;--warn:#8a5f00;--warn-bg:#fbefd0;--mark:#f7e3a1;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);--r:12px;--serif:Cambria,Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--surface:#1c2026;--surface2:#252b32;--ink:#e8e4dc;--muted:#9ba2aa;--line:#343b44;--accent:#8fb3e0;--accent-ink:#0e1620;--accent-soft:#22324a;--gold:#d6b25e;--ok:#6cc48f;--ok-bg:#1c3226;--err:#ee8b85;--err-bg:#3b2323;--warn:#e7c05e;--warn-bg:#3a321a;--mark:#5b4a17;--shadow:none}}
:root[data-theme="dark"]{--bg:#14171b;--surface:#1c2026;--surface2:#252b32;--ink:#e8e4dc;--muted:#9ba2aa;--line:#343b44;--accent:#8fb3e0;--accent-ink:#0e1620;--accent-soft:#22324a;--gold:#d6b25e;--ok:#6cc48f;--ok-bg:#1c3226;--err:#ee8b85;--err-bg:#3b2323;--warn:#e7c05e;--warn-bg:#3a321a;--mark:#5b4a17;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100dvh}
a{color:var(--accent)}
h1{font:600 1.55rem/1.2 var(--serif);margin:.1rem 0 .3rem}
h2{font:600 1.2rem/1.3 var(--serif);margin:0 0 .6rem}
h3{font:600 1.05rem/1.3 var(--sans);margin:0 0 .6rem}
h4{margin:1rem 0 .3rem;font-size:.95rem}
p{margin:.4rem 0}
.muted{color:var(--muted)}.small{font-size:.85rem}.serif{font-family:var(--serif)}
#app{display:flex;min-height:100dvh}
#nav{width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100dvh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font:600 1.1rem var(--serif)}
.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:1.2rem}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none;margin-bottom:2px}
#nav a:hover{background:var(--surface2)}
#nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#nav .ver{font-size:.75rem;color:var(--muted);padding:12px 10px}
#main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1080px}
#tabbar{display:none}
@media (max-width:860px){
 #nav{display:none}
 #main{padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
 #tabbar a,#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;font-family:inherit}
 #tabbar .ic{font-size:1.25rem;line-height:1}
 #tabbar .on{color:var(--accent);font-weight:600}
}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{font-size:.85rem;text-decoration:none;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.kpi{font:600 2rem/1 var(--serif);margin:.3rem 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 15px;font:600 .92rem var(--sans);cursor:pointer;text-decoration:none;min-height:40px;-webkit-tap-highlight-color:transparent}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:default}
.btn.file{position:relative}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:.5rem 0}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
.sp{flex:1}
.field{margin:0 0 12px}
.field>label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;font:16px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{resize:vertical;line-height:1.5}
textarea.serif{font-family:var(--serif)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:.92rem;cursor:pointer}
.chk input{width:18px;height:18px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;font:600 .88rem var(--sans);color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:.83rem;color:var(--muted);margin:.35rem 0}
.hint.warn{color:var(--warn)}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg);color:var(--warn);margin-bottom:14px;font-size:.92rem}
.banner a{color:inherit;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}
.item:hover{border-color:var(--accent)}
.gh{margin:16px 0 8px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:var(--r);margin:10px 0 18px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.art{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.art-h{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.rot{font-weight:700;font-family:var(--serif)}
.ic{border:0;background:transparent;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:4px 7px;border-radius:7px}
.ic:hover{background:var(--surface2)}.ic.on{color:var(--gold)}
.lei-txt{font-family:var(--serif);font-size:1.02rem;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.lei-txt.big{font-size:1.12rem}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
mark.rev{background:var(--ok-bg);color:var(--ok)}
.lac{display:inline;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:600 .82rem var(--sans);padding:1px 8px;border-radius:5px;cursor:pointer;vertical-align:baseline}
.lac-in{display:inline-block;font:1rem var(--serif);border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;min-width:5ch;color:var(--ink)}
.lac-in.ok{border-color:var(--ok);background:var(--ok-bg)}.lac-in.err{border-color:var(--err);background:var(--err-bg)}
.corr{font:600 .85rem var(--sans);color:var(--ok);margin-left:3px}
.rev-bar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}
@media (min-width:861px){.rev-bar{bottom:0}}
.rev-bar .btn{flex:1;min-width:120px;flex-direction:column;gap:0;min-height:52px}
.rev-bar .btn small{font-weight:400;font-size:.72rem;opacity:.85}
.g0{background:var(--err)!important;border-color:var(--err)!important;color:#fff!important}.g1{background:var(--warn)!important;border-color:var(--warn)!important;color:#fff!important}.g2{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}.g3{background:var(--accent)!important}
.qhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.enun{font-family:var(--serif);font-size:1.06rem;line-height:1.65;white-space:pre-wrap;margin-bottom:12px}
.alt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;font:1rem/1.55 var(--serif);color:var(--ink);cursor:pointer;position:relative}
.alt b{font-family:var(--sans);flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:.85rem}
.alt span{flex:1}
.alt .risc{font-style:normal;color:var(--muted);padding:0 4px;font-family:var(--sans);font-size:.9rem}
.alt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.alt.sel b{background:var(--accent);color:var(--accent-ink)}
.alt.riscada span{text-decoration:line-through;opacity:.5}
.alt.certa{border-color:var(--ok);background:var(--ok-bg)}.alt.certa b{background:var(--ok);color:#fff}
.alt.errada{border-color:var(--err);background:var(--err-bg)}.alt.errada b{background:var(--err);color:#fff}
.vf{display:flex;gap:10px}.vf .btn{flex:1;min-height:52px}
.fb{border-radius:10px;padding:10px 13px;margin:12px 0 6px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.err{background:var(--err-bg);color:var(--err)}
.coment{border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
.coment p{white-space:pre-wrap}
.analise{padding-left:18px}.analise li{margin-bottom:5px}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--gold);background:var(--surface2);border-radius:0 8px 8px 0;white-space:pre-wrap}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.dots button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font:600 .8rem var(--sans);color:var(--ink);cursor:pointer}
.dots .cur{outline:2px solid var(--accent)}.dots .resp{background:var(--accent-soft)}.dots .ok{background:var(--ok-bg);color:var(--ok)}.dots .err{background:var(--err-bg);color:var(--err)}
.timer{font:600 1rem var(--sans);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.mwrap{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
@media (min-width:700px){.mwrap{align-items:center;padding:20px}.modal{border-radius:16px}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--surface2);display:block}
.heat i.l1{background:#b9cfe6}.heat i.l2{background:#7fa6d1}.heat i.l3{background:#3f6fa6}.heat i.l4{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600}
.mini{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;min-width:60px}
.mini i{display:block;height:100%;background:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.z{background:var(--surface2)}
.md h2,.md h3,.md h4{font-family:var(--serif)}
.md p,.md li{line-height:1.6}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
.qline{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.qline .st{flex:0 0 22px;font-weight:700;text-align:center}
.qline .tx{flex:1;font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#print-area{display:none}
@media print{
 body{background:#fff;color:#000}
 #app,#tabbar,#toast,#modal-root{display:none!important}
 #print-area{display:block;font:11pt/1.5 Cambria,Georgia,serif;padding:0 8mm}
 #print-area .pq{break-inside:avoid;margin-bottom:12pt}
 #print-area h1{font-size:15pt}
}
</style>

<script>
'use strict';
const APP_VER='1.0.0';

/* ===================== utilidades ===================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const uid=()=>(self.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br=s=>esc(s).replace(/\n/g,'<br>');
const DIA=86400000;
const hoje=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtData=ts=>{const d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const embaralhar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const abortErr=()=>{const e=new Error('Cancelado');e.name='AbortError';return e;};
function sleep(ms,signal){return new Promise((res,rej)=>{const t=setTimeout(res,ms);if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);rej(abortErr());},{once:true});});}
function fmtDur(ms){const s=Math.round(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+'h ':'')+String(m).padStart(h?2:1,'0')+'min '+String(ss).padStart(2,'0')+'s';}
function loadScript(src){return new Promise((res,rej)=>{if($$('script').some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Não foi possível carregar '+src+' (verifique a conexão).'));document.head.appendChild(s);});}

/* ===================== banco local (IndexedDB) ===================== */
const DB={
 db:null,
 stores:['leis','cartoes','materiais','textos','questoes','tentativas','discursivas','resumos','log'],
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('juris-memoria',1);r.onupgradeneeded=()=>{const d=r.result;for(const s of this.stores)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});};r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
 st(s,m){return this.db.transaction(s,m).objectStore(s);},
 req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
 get(s,id){return id==null?Promise.resolve(undefined):this.req(this.st(s,'readonly').get(id));},
 all(s){return this.req(this.st(s,'readonly').getAll());},
 put(s,o){return this.req(this.st(s,'readwrite').put(o));},
 del(s,id){return this.req(this.st(s,'readwrite').delete(id));},
 clear(s){return this.req(this.st(s,'readwrite').clear());},
 putMany(s,arr){return new Promise((res,rej)=>{if(!arr.length)return res();const t=this.db.transaction(s,'readwrite');const o=t.objectStore(s);arr.forEach(x=>o.put(x));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});},
 delMany(s,ids){return new Promise((res,rej)=>{if(!ids.length)return res();const t=this.db.transaction(s,'readwrite');const o=t.objectStore(s);ids.forEach(x=>o.delete(x));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
};
async function pedirPersistencia(){try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist();}catch(e){}}

/* ===================== configurações ===================== */

const Job={ctx:null};
async function job(titulo,fn){
 const ac=new AbortController();
 const w=modal(`<h3>${esc(titulo)}</h3><div class="bar"><i style="width:0"></i></div><p class="muted jmsg">Iniciando…</p><div class="row end"><button class="btn ghost" data-cancel>Cancelar</button></div>`,{lock:true});
 $('[data-cancel]',w).onclick=()=>{ac.abort();$('.jmsg',w).textContent='Cancelando…';};
 const ctx={signal:ac.signal,progress(p,msg){if(p!=null)$('.bar i',w).style.width=Math.round(Math.max(0,Math.min(1,p))*100)+'%';if(msg)$('.jmsg',w).textContent=msg;},msg(m){$('.jmsg',w).textContent=m;}};
 Job.ctx=ctx;
 try{return await fn(ctx);}
 catch(e){if(ac.signal.aborted||e.name==='AbortError'){toast('Operação interrompida. O que já foi gerado ficou salvo.');return null;}console.error(e);alertModal('Não foi possível concluir',e.message||String(e));return null;}
 finally{Job.ctx=null;w.remove();}
}

function md(s){
 const lines=String(s||'').replace(/\r/g,'').split('\n');let h='',lista=null;
 const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\s][^*]*?)\*/g,'<em>$1</em>');
 const fecha=()=>{if(lista){h+=`</${lista}>`;lista=null;}};
 for(const l of lines){let m;
  if((m=l.match(/^(#{1,4})\s+(.*)/))){fecha();const n=Math.min(4,m[1].length+1);h+=`<h${n}>${inl(m[2])}</h${n}>`;}
  else if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(lista!=='ul'){fecha();h+='<ul>';lista='ul';}h+=`<li>${inl(m[1])}</li>`;}
  else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(lista!=='ol'){fecha();h+='<ol>';lista='ol';}h+=`<li>${inl(m[1])}</li>`;}
  else if(!l.trim())fecha();
  else{fecha();h+=`<p>${inl(l)}</p>`;}
 }
 fecha();return `<div class="md">${h}</div>`;
}

const GEMINI='https://generativelanguage.googleapis.com/v1beta/';
function parseJSON(txt){
 let t=String(txt||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
 try{return JSON.parse(t);}catch(e){}
 const a=t.indexOf('{'),b=t.lastIndexOf('}');
 if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
 throw new Error('A IA devolveu uma resposta em formato inesperado. Tente novamente (ou reduza a quantidade por lote).');
}
async function gemini({system,prompt,parts,schema,temperature,signal}){
 const cfg=Cfg.get();
 if(!cfg.apiKey)throw new Error('Configure a chave da API do Gemini em Ajustes antes de usar recursos de IA.');
 const url=`${GEMINI}models/${encodeURIComponent(cfg.model||'gemini-flash-latest')}:generateContent?key=${encodeURIComponent(cfg.apiKey)}`;
 const body={contents:[{role:'user',parts:parts||[{text:prompt}]}],generationConfig:{temperature:temperature==null?+cfg.temp:temperature}};
 if(schema){body.generationConfig.responseMimeType='application/json';body.generationConfig.responseSchema=schema;}
 if(system)body.systemInstruction={parts:[{text:system}]};
 signal=signal||(Job.ctx&&Job.ctx.signal);
 for(let t=0;t<6;t++){
  let r;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal});}
  catch(e){if(e.name==='AbortError')throw e;if(t<5){await sleep(2000*(t+1),signal);continue;}throw new Error('Falha de rede ao contatar o Gemini: '+e.message);}
  if([429,500,502,503,504].includes(r.status)){
   const espera=Math.min(65000,4000*Math.pow(2,t));
   if(Job.ctx)Job.ctx.msg(`A API respondeu ${r.status} (limite de uso ou instabilidade). Nova tentativa em ${Math.round(espera/1000)} s…`);
   await sleep(espera,signal);continue;
  }
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.error&&j.error.message)||('Erro HTTP '+r.status);
   if(r.status===404)throw new Error(`Modelo "${cfg.model}" indisponível para a sua chave. Em Ajustes, toque em “Testar chave e listar modelos” e escolha outro. Detalhe: ${m}`);
   if(r.status===400&&/API key/i.test(m))throw new Error('Chave da API inválida. Confira em Ajustes. Detalhe: '+m);
   throw new Error(m);}
  const c=j.candidates&&j.candidates[0];
  if(!c)throw new Error('A IA não devolveu conteúdo'+(j.promptFeedback&&j.promptFeedback.blockReason?' (bloqueio: '+j.promptFeedback.blockReason+')':'')+'.');
  const txt=((c.content&&c.content.parts)||[]).filter(p=>!p.thought&&typeof p.text==='string').map(p=>p.text).join('');
  if(!txt){if(c.finishReason==='MAX_TOKENS')throw new Error('A resposta excedeu o limite de tamanho. Reduza a quantidade por lote.');throw new Error('Resposta vazia da IA (motivo: '+(c.finishReason||'desconhecido')+').');}
  return schema?parseJSON(txt):txt;
 }
 throw new Error('A API permaneceu indisponível após várias tentativas. Aguarde alguns minutos (limite da cota gratuita) e tente de novo.');
}
async function listarModelos(chave){

 if(!r.ok)throw new Error((j.error&&j.error.message)||('Erro HTTP '+r.status));
 return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/gemini/i.test(m.name)&&!/(image|tts|audio|embedding|live|robotics|computer)/i.test(m.name)).map(m=>({id:m.name.replace(/^models\//,''),nome:m.displayName||m.name}));
}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function carregarPdfJs(){if(!window.pdfjsLib){await loadScript(PDFJS+'pdf.min.js');}window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';}
function paginar(texto,tam=3500){
 const pars=String(texto).replace(/\r/g,'').split(/\n(?=\s*\n)|\n{2,}/);const pags=[];let cur='';
 for(const p of pars){if(cur.length+p.length>tam&&cur){pags.push(cur.trim());cur='';}cur+=p+'\n\n';}
 if(cur.trim())pags.push(cur.trim());return pags.length?pags:[''];
}
function textoDeItens(items){let s='';for(const it of items){s+=it.str;s+=it.hasEOL?'\n':(it.str&&!/\s$/.test(it.str)?' ':'');}return s.replace(/[ \t]+\n/g,'\n').replace(/ {2,}/g,' ').trim();}
async function extrairArquivo(file,ctx){
 const nome=file.name.toLowerCase();
 if(nome.endsWith('.pdf')||file.type==='application/pdf'){
  await carregarPdfJs();
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const paginas=[];
  for(let i=1;i<=pdf.numPages;i++){
   if(ctx.signal.aborted)throw abortErr();
   const p=await pdf.getPage(i);const tc=await p.getTextContent();paginas.push(textoDeItens(tc.items));p.cleanup();
   ctx.progress(i/pdf.numPages,`Extraindo texto: página ${i} de ${pdf.numPages}`);
  }
  return {paginas,tipo:'pdf',pdf};
 }
 if(nome.endsWith('.docx')){
  ctx.msg('Lendo DOCX…');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
  return {paginas:paginar(r.value),tipo:'docx'};
 }
 if(nome.endsWith('.html')||nome.endsWith('.htm')){const d=new DOMParser().parseFromString(await file.text(),'text/html');return {paginas:paginar(d.body.innerText||d.body.textContent),tipo:'html'};}
 return {paginas:paginar(await file.text()),tipo:'txt'};
}
async function ocrPdf(pdf,paginas,ctx){
 const lote=3,total=pdf.numPages;
 for(let i=1;i<=total;i+=lote){
  if(ctx.signal.aborted)throw abortErr();
  const parts=[{text:`Transcreva integral e fielmente o texto das ${Math.min(lote,total-i+1)} página(s) a seguir, em português, preservando parágrafos, numeração de artigos, incisos e notas. Comece cada página com a linha ===PÁGINA=== . Não resuma, não comente e não acrescente nada.`}];
  for(let n=i;n<Math.min(i+lote,total+1);n++){
   const pg=await pdf.getPage(n);const vp=pg.getViewport({scale:1.6});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
   await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
   parts.push({inline_data:{mime_type:'image/jpeg',data:cv.toDataURL('image/jpeg',0.72).split(',')[1]}});cv.width=cv.height=0;pg.cleanup();
  }
  ctx.progress((i-1)/total,`Transcrevendo com IA: páginas ${i} a ${Math.min(i+lote-1,total)} de ${total}`);
  const txt=await gemini({parts,temperature:0.1});
  const pedacos=txt.split(/===\s*P[ÁA]GINA\s*===/i).map(s=>s.trim()).filter(s=>s);
  for(let k=0;k<Math.min(lote,total-i+1);k++){paginas[i-1+k]=pedacos[k]||paginas[i-1+k]||'';}
 }
 return paginas;
}

/* ===================== legislação: divisão e lacunas ===================== */
const reArtigo=/^\s*Art(?:igo)?\.?\s*\d/i;
const reCabecalho=/^\s*(LIVRO|PARTE|T[IÍ]TULO|CAP[IÍ]TULO|SE[CÇ][AÃ]O|SUBSE[CÇ][AÃ]O)\b/i;
function dividirArtigos(texto){
 const linhas=String(texto||'').replace(/\r/g,'').replace(/\u00a0/g,' ').split('\n');
 const arts=[];let atual=null,secao='',aguardaNome=false;const pre=[];
 for(const raw of linhas){
  const l=raw.trim();if(!l)continue;
  if(reCabecalho.test(l)&&l.length<160&&!reArtigo.test(l)){secao=l;aguardaNome=true;continue;}
  if(aguardaNome&&!reArtigo.test(l)&&l.length<140&&!/[.;:]$/.test(l)){secao+=' — '+l;aguardaNome=false;continue;}
  aguardaNome=false;
  if(reArtigo.test(l)){atual={texto:l,secao};arts.push(atual);continue;}
  if(atual)atual.texto+='\n'+l;else pre.push(l);
 }
 if(!arts.length){
  return String(texto||'').replace(/\r/g,'').split(/\n\s*\n/).map(s=>s.trim()).filter(s=>s.length>3).map((t,i)=>{const m=t.match(/^\s*(S[úu]mula(?: Vinculante)?\s*(?:n[ºo.]?\s*)?\d+|Enunciado\s*(?:n[ºo.]?\s*)?\d+|Tema\s*\d+)/i);return {texto:t,secao:'',rotulo:m?m[1]:'Trecho '+(i+1)};});
 }
 for(const a of arts){const m=a.texto.match(/^\s*(Art(?:igo)?\.?\s*[\d.]+\s*(?:[º°o](?![a-z]))?(?:\s*-\s*[A-Z]\b)?)/i);a.rotulo=m?m[1].replace(/\s+/g,' ').trim():'Art.';}
 if(pre.join(' ').length>200)arts.unshift({texto:pre.join('\n'),secao:'',rotulo:'Preâmbulo'});
 return arts;
}
const lacRe=()=>/\{\{([\s\S]+?)(?:::([^{}]*?))?\}\}/g;
const stripCloze=m=>String(m||'').replace(lacRe(),'$1');
const temLacunas=m=>lacRe().test(m||'');
function contarLacunas(m){return (String(m||'').match(lacRe())||[]).length;}
function montarMarkup(texto,marks){
 marks.sort((a,b)=>a.i-b.i);const ok=[];let fim=-1;
 for(const m of marks){if(m.i>=fim&&m.f>m.i){ok.push(m);fim=m.f;}}
 let out='',pos=0;
 for(const m of ok){out+=texto.slice(pos,m.i)+'{{'+texto.slice(m.i,m.f)+(m.d?'::'+String(m.d).replace(/[{}:]/g,'').trim():'')+'}}';pos=m.f;}
 return {markup:out+texto.slice(pos),n:ok.length};
}
function aplicarLacunas(texto,lacunas,minIdx=0){
 const marks=[];const low=texto.toLowerCase();
 for(const l of lacunas||[]){
  const t=String(l.trecho||'').trim();if(t.length<2||t.length>180)continue;
  let i=texto.indexOf(t),f=i+t.length;
  if(i<0){i=low.indexOf(t.toLowerCase());f=i+t.length;}
  if(i<0){const m=new RegExp(t.split(/\s+/).map(escRe).join('\\s+'),'i').exec(texto);if(m){i=m.index;f=i+m[0].length;}}
  while(i>=0&&(i<minIdx||marks.some(m=>i<m.f&&f>m.i))){i=low.indexOf(t.toLowerCase(),i+1);f=i+t.length;}
  if(i>=0)marks.push({i,f,d:l.dica});
 }
 return montarMarkup(texto,marks);
}

function autoCloze(texto,dens='media',minIdx=0){

 const base={leve:1,media:3,intensa:7}[dens]||3;
 const max=Math.max(1,Math.min(base,Math.ceil(texto.length/(dens==='intensa'?120:260))));
 cand.sort((a,b)=>a.p-b.p||a.i-b.i);
 const escolhidos=[];
 for(const c of cand){if(escolhidos.length>=max)break;if(!escolhidos.some(e=>c.i<e.f&&c.f>e.i))escolhidos.push(c);}
 return montarMarkup(texto,escolhidos);
}
const DENS_TXT={leve:'1 ou 2 lacunas, apenas o ponto mais cobrável do dispositivo',media:'2 a 4 lacunas, proporcionais à extensão do dispositivo',intensa:'de 4 a 8 lacunas nos dispositivos longos, cobrindo todos os pontos cobráveis'};
async function gerarLacunasIA(cards,dens,ctx){

 const lotes=[];let atual=[],tam=0;
 for(const c of cards){if((tam+c.texto.length>12000||atual.length>=40)&&atual.length){lotes.push(atual);atual=[];tam=0;}atual.push(c);tam+=c.texto.length;}
 if(atual.length)lotes.push(atual);
 const schema={type:'OBJECT',properties:{dispositivos:{type:'ARRAY',items:{type:'OBJECT',properties:{id:{type:'STRING'},lacunas:{type:'ARRAY',items:{type:'OBJECT',properties:{trecho:{type:'STRING'},dica:{type:'STRING'}},required:['trecho']}}},required:['id','lacunas']}}},required:['dispositivos']};

 for(let li=0;li<lotes.length;li++){

  const prompt=`Tarefa: preparar cartões de memorização com lacunas (estilo Anki/cloze) a partir de dispositivos legais, para candidato à magistratura.
Para cada dispositivo, escolha os trechos que as bancas (FGV, FCC, VUNESP, CEBRASPE) mais provavelmente explorariam para criar pegadinhas: prazos; números, quóruns e frações; órgão ou autoridade competente; sujeitos legitimados; verbos que definem dever ou faculdade (pode/deve); vedações; exceções e ressalvas (salvo, exceto, ressalvado); requisitos; efeitos e consequências; termos técnicos que poderiam ser trocados por institutos vizinhos.
Regras:
1. Cada "trecho" deve ser cópia EXATA e contínua do texto do dispositivo, com a mesma grafia, pontuação e acentuação.
2. Trechos curtos, de 1 a 8 palavras, sem sobreposição entre si.
3. Não use o número do artigo como lacuna.
4. Dispositivos revogados ou vetados recebem zero lacunas.
5. "dica" é uma categoria curta que não revela a resposta (prazo, órgão, quórum, exceção, verbo, requisito, efeito, sujeito, termo técnico).
6. Quantidade por dispositivo: ${DENS_TXT[dens]||DENS_TXT.media}.
Responda em JSON conforme o esquema, usando exatamente os ids fornecidos.

DISPOSITIVOS:
${lote.map((c,i)=>`[d${i+1}]\n${c.texto}`).join('\n\n')}`;
  const r=await gemini({prompt,schema,temperature:0.2});
  const mapa={};(r.dispositivos||[]).forEach(d=>{mapa[String(d.id).replace(/[\[\]\s]/g,'')]=d.lacunas||[];});
  const salvar=[];

  await DB.putMany('cartoes',salvar);feitos+=salvar.length;
 }

 toast(`${total} lacunas criadas em ${feitos} dispositivos.`);
 return {total,feitos};
}

function agendar(s,g){
 const now=Date.now();
 if(g===0){if(s.reps>0)s.lapses=(s.lapses||0)+1;s.reps=0;s.interval=0;s.ease=Math.max(1.3,s.ease-0.2);s.due=now+10*60000;}
 else{let iv;
  if(s.reps===0)iv=g===1?1:g===2?1:4;
  else if(s.reps===1)iv=g===1?2:g===2?3:7;
  else iv=g===1?Math.max(s.interval+1,s.interval*1.2):g===2?s.interval*s.ease:s.interval*s.ease*1.3;
  if(g===1)s.ease=Math.max(1.3,s.ease-0.15);if(g===3)s.ease+=0.15;
  s.interval=Math.max(1,Math.round(iv));s.reps++;
  const d=new Date(now+s.interval*DIA);d.setHours(3,0,0,0);s.due=d.getTime();
 }
 s.visto=true;s.ultima=now;return s;
}
function previa(s,g){const c=agendar(JSON.parse(JSON.stringify(s)),g);if(g===0)return '10 min';const d=c.interval;return d<30?d+' d':d<365?Math.round(d/30)+' m':(d/365).toFixed(1)+' a';}

const DIFIC_TXT={facil:'fácil',media:'média',dificil:'difícil (nível magistratura)',mista:'mista (distribua entre fácil, média e difícil, com predomínio de média e difícil)'};
function validarQuestao(raw,p,seg){
 const q={id:uid(),criado:Date.now(),origem:p.origem,disciplina:p.disciplina,banca:p.banca,tipoGerado:p.tipo};
 q.formato=p.tipo==='vf'?'ce':'me';
 q.enunciado=String(raw.enunciado||'').trim();if(q.enunciado.length<15)return null;
 if(q.formato==='ce'){
  const g=norm(raw.gabarito);q.gabarito=/^(c|certo|v|verdadeir)/.test(g)?'C':/^(e|errado|f|fals)/.test(g)?'E':null;if(!q.gabarito)return null;q.alternativas=[];
 }else{
  let alts=(raw.alternativas||[]).map(a=>String(a.texto||'').replace(/^\s*\(?[A-Ea-e][).:\-–]\s+/,'').trim()).filter(Boolean);
  if(alts.length<4||alts.length>5)return null;
  const letras='ABCDE';q.alternativas=alts.map((t,i)=>({letra:letras[i],texto:t}));
  const g=String(raw.gabarito||'').trim().toUpperCase().replace(/[^A-E]/g,'').charAt(0);
  if(!g||letras.indexOf(g)>=alts.length)return null;q.gabarito=g;
 }
 q.comentario=String(raw.comentario||'').trim();
 q.analise=(raw.analise||[]).filter(a=>a&&a.motivo).map(a=>({letra:String(a.letra||'').trim().toUpperCase().slice(0,2),motivo:String(a.motivo).trim()}));
 q.fundamento={dispositivo:String(raw.fundamento_dispositivo||'').trim(),trecho:String(raw.fundamento_trecho||'').trim()};
 q.externa=!!raw.depende_fonte_externa||!!seg.tema;
 q.tema=String(raw.tema||'').trim();q.dificuldade=String(raw.dificuldade||'').trim().toLowerCase();q.estilo=String(raw.estilo||'').trim();
 if(seg.tema)q.fundamentoConferido=null;
 else{const ft=norm(q.fundamento.trecho);q.fundamentoConferido=ft.length>=12&&norm(seg.texto).includes(ft);}
 q.verificar=q.externa||q.fundamentoConferido!==true;
 return q;
}
async function gerarQuestoes(p,ctx,saida){
 const segs=p.segmentos,N=Math.max(1,Math.min(500,+p.qtd||10));
 const porChamada=p.tipo==='vf'?10:(p.banca==='FGV'?5:6);
 const cont=new Array(segs.length).fill(0);const ordem=embaralhar(segs.map((_,i)=>i));
 for(let k=0;k<N;k++)cont[ordem[k%ordem.length]]++;
 const plano=[];for(let i=0;i<segs.length;i++){let c=cont[i];while(c>0){const k=Math.min(porChamada,c);plano.push({seg:i,k});c-=k;}}
 const banca=Cfg.get().bancas[p.banca]||Cfg.get().bancas.GENERICA;
 const vistos=new Set();let falhas=0;
 for(let pi=0;pi<plano.length;pi++){
  if(ctx.signal.aborted)throw abortErr();
  const {seg:si,k}=plano[pi];const seg=segs[si];
  ctx.progress(saida.length/N,`Gerando questões: ${saida.length} de ${N} prontas (chamada ${pi+1} de ${plano.length})…`);
  const tipoTxt=p.tipo==='vf'
   ?`itens de julgamento Verdadeiro ou Falso (formato "ce": uma assertiva por item, sem alternativas; gabarito "C" quando verdadeira e "E" quando falsa). Equilibre verdadeiras e falsas; as falsas devem conter um único erro relevante e plausível, do tipo que a banca usa (troca de prazo, órgão, verbo, exceção ou instituto vizinho). Itens podem ter breve situação hipotética.`
   :`múltipla escolha (formato "me") com exatamente 5 alternativas (A a E) e uma única correta. Varie a letra do gabarito entre as questões.`;
  const formatos=(p.formatos&&p.formatos.length?p.formatos:banca.formatos||['situacao','literal']).map(f=>FORMATOS[f]).filter(Boolean);
  const prompt=`PARÂMETROS
- Quantidade nesta resposta: ${k} questão(ões).
- Tipo: ${tipoTxt}
- Banca de referência: ${banca.nome}
- Perfil da banca: ${banca.perfil}
${banca.exemplos&&banca.exemplos.trim()?`- Exemplos reais da banca (servem apenas para imitar o estilo de redação; não copie nem reaproveite o conteúdo):\n"""\n${banca.exemplos.trim().slice(0,6000)}\n"""\n`:''}- Formatos a distribuir entre as questões: ${formatos.join('; ')}.
- Dificuldade: ${DIFIC_TXT[p.dificuldade]||DIFIC_TXT.mista}.
- Disciplina: ${p.disciplina||'—'}.
${vistos.size?`- Já foram geradas questões sobre os seguintes pontos; explore outros dispositivos ou aspectos: ${Array.from(vistos).slice(-30).join('; ')}.\n`:''}
${seg.tema?`TEMA (não há texto-base; use conhecimento jurídico consolidado e atual, indique em "fundamento_dispositivo" o dispositivo legal pertinente, escreva em "fundamento_trecho" a regra em uma frase e marque "depende_fonte_externa" como true):\n${seg.tema}`:`TEXTO-BASE (${seg.rotulo}):\n"""\n${seg.texto}\n"""`}

Para cada questão preencha: formato; estilo (um dos formatos usados); enunciado (inclua no próprio enunciado as assertivas I, II, III, quando for o caso); alternativas (vazio no formato "ce"); gabarito; comentario (explicação didática do gabarito, de 2 a 5 frases); analise (no formato "me", uma linha por alternativa dizendo por que está certa ou errada; no formato "ce", vazio); fundamento_dispositivo (ex.: "art. 37, § 6º, da CF" ou "p. 12 do material"); fundamento_trecho; depende_fonte_externa; tema (2 a 6 palavras); dificuldade (fácil, média ou difícil).`;
  let r;
  try{r=await gemini({system:SYS_EXAMINADOR,prompt,schema:qSchema});}
  catch(e){if(e.name==='AbortError')throw e;falhas++;if(falhas>3||!saida.length&&falhas>1)throw e;continue;}
  const novas=[];
  for(const raw of (r.questoes||[])){
   const q=validarQuestao(raw,p,seg);if(!q)continue;
   const chave=norm(q.enunciado).slice(0,140)+'|'+norm((q.alternativas[0]||{}).texto).slice(0,40);
   if(vistos.has(chave))continue;vistos.add(chave);if(q.tema)vistos.add(q.tema);
   novas.push(q);if(saida.length+novas.length>=N)break;
  }
  await DB.putMany('questoes',novas);saida.push(...novas);
  if(saida.length>=N)break;
 }
 ctx.progress(1,'Concluído');
 return saida;
}

 }
 const doDeck=ativos.filter(c=>deck==='all'||c.deck===deck);
 const dev=doDeck.filter(c=>c.srs.visto&&c.srs.due<=now).sort((a,b)=>a.srs.due-b.srs.due);
 const nov=doDeck.filter(c=>!c.srs.visto).sort((a,b)=>a.deck===b.deck?a.ordem-b.ordem:0).slice(0,novosRest);

 let i=0,revelado=false,feitos=0,acertos=0;

 };

 const barra=(sug)=>{

async function viewResolver(main){
 const s=Sessao.get();
 if(!s){main.innerHTML=`<header class="ph"><h1>Resolver</h1></header>${vazio('Nenhuma sessão em andamento.','Gere questões ou escolha no banco.')}<div class="row center"><a class="btn" href="#/questoes">Banco de questões</a></div>`;return;}
 const mapa={};(await Promise.all(s.ids.map(id=>DB.get('questoes',id)))).forEach(q=>{if(q)mapa[q.id]=q;});
 s.ids=s.ids.filter(id=>mapa[id]);if(!s.ids.length){Sessao.clear();return viewResolver(main);}
 s.i=Math.min(s.i,s.ids.length-1);
 const salvar=()=>Sessao.set(s);
 const finalizar=async()=>{
  const nr=s.ids.filter(id=>!s.resp[id]).length;
  if(nr&&!(await confirmar('Finalizar simulado',`${nr} questão(ões) sem resposta contarão como erradas. Finalizar?`,'Finalizar')))return;
  s.fim=Date.now();for(const id of s.ids)await registrar(mapa[id],s.resp[id]||null,s.tempos[id]||0,s.id);s.i=-1;salvar();desenhar();
 };
 const desenhar=()=>{
  if(App.timer){clearInterval(App.timer);App.timer=null;}
  const n=s.ids.length;
  if(s.i===-1){
   const ac=s.ids.filter(id=>s.resp[id]===mapa[id].gabarito).length;
   const porD={};s.ids.forEach(id=>{const q=mapa[id];const k=q.tema||q.disciplina||'—';const o=porD[k]||(porD[k]={n:0,a:0});o.n++;if(s.resp[id]===q.gabarito)o.a++;});
   main.innerHTML=`<header class="ph"><div><h1>Resultado</h1><p class="muted">${s.modo==='simulado'?'Simulado':'Treino'} · ${fmtDur((s.fim||Date.now())-s.inicio)}</p></div></header>
   <div class="grid"><div class="card"><h3>Acertos</h3><div class="kpi">${ac}/${n}</div><p class="muted">${pct(ac,n)}%</p></div><div class="card"><h3>Tempo médio</h3><div class="kpi">${fmtDur(((s.fim||Date.now())-s.inicio)/n)}</div><p class="muted">por questão</p></div></div>
   <div class="card"><h3>Por tema</h3><table><tr><th>Tema</th><th>Acertos</th></tr>${Object.keys(porD).map(k=>`<tr><td>${esc(k)}</td><td>${porD[k].a}/${porD[k].n}</td></tr>`).join('')}</table></div>
   <div class="card"><h3>Revisar questões</h3><div class="dots">${s.ids.map((id,k)=>`<button class="${s.resp[id]===mapa[id].gabarito?'ok':'err'}" data-go="${k}">${k+1}</button>`).join('')}</div>
   <div class="row"><button class="btn" id="refazer">Refazer as erradas</button><button class="btn ghost" id="novo">Encerrar</button></div></div>`;
   $$('[data-go]').forEach(b=>b.onclick=()=>{s.i=+b.dataset.go;salvar();desenhar();});
   $('#refazer').onclick=()=>{const er=s.ids.filter(id=>s.resp[id]!==mapa[id].gabarito);if(!er.length)return toast('Nenhuma errada.');iniciarSessao(er,'treino');};
   $('#novo').onclick=()=>{Sessao.clear();go('#/questoes');};
   return;
  }
  const q=mapa[s.ids[s.i]];const resp=s.resp[q.id];
  const mostrar=s.modo==='simulado'?!!s.fim:!!resp;
  const dotsCls=id=>{const r=s.resp[id];if(!r)return '';if(s.modo==='simulado'&&!s.fim)return 'resp';return r===mapa[id].gabarito?'ok':'err';};
  main.innerHTML=`<div class="row"><strong>Questão ${s.i+1} de ${n}</strong><span class="pill">${s.modo==='simulado'?'Simulado':'Treino'}</span><span class="sp"></span>${s.modo==='simulado'&&!s.fim?'<span class="timer" id="tmr"></span><button class="btn sm" id="fin">Finalizar</button>':`${s.fim?'<button class="btn ghost sm" id="res">Resultado</button>':''}<button class="btn ghost sm" id="enc">Encerrar</button>`}</div>
  <div class="card" id="qc">${questaoHTML(q,resp,mostrar,s.risc[q.id])}</div>
  <div class="row"><button class="btn ghost" id="ant"${s.i?'':' disabled'}>‹ Anterior</button><span class="sp"></span><button class="btn" id="prox">${s.i<n-1?'Próxima ›':(s.modo==='simulado'&&!s.fim?'Finalizar':'Ver resultado')}</button></div>
  <details><summary>Navegar pelas questões</summary><div class="dots">${s.ids.map((id,k)=>`<button class="${dotsCls(id)}${k===s.i?' cur':''}" data-go="${k}">${k+1}</button>`).join('')}</div></details>`;
  const marcaTempo=()=>{const id=s.ids[s.i];s.tempos[id]=(s.tempos[id]||0)+(Date.now()-(s.qIni||Date.now()));s.qIni=Date.now();};
  const ir=k=>{marcaTempo();s.i=k;salvar();desenhar();window.scrollTo(0,0);};
  $$('[data-go]').forEach(b=>b.onclick=()=>ir(+b.dataset.go));
  $('#ant').onclick=()=>ir(s.i-1);
  $('#prox').onclick=()=>{if(s.i<n-1)ir(s.i+1);else if(s.modo==='simulado'&&!s.fim){marcaTempo();finalizar();}else{marcaTempo();if(!s.fim)s.fim=Date.now();s.i=-1;salvar();desenhar();}};
  const enc=$('#enc');if(enc)enc.onclick=async()=>{if(await confirmar('Encerrar sessão','As respostas dadas ficam registradas nas estatísticas.','Encerrar')){Sessao.clear();go('#/questoes');}};
  const res=$('#res');if(res)res.onclick=()=>{s.i=-1;salvar();desenhar();};
  const fin=$('#fin');if(fin)fin.onclick=()=>{marcaTempo();finalizar();};
  if(s.limite&&!s.fim){const tick=()=>{const r=s.limite-Date.now();const el=$('#tmr');if(!el)return;if(r<=0){el.textContent='0:00';clearInterval(App.timer);App.timer=null;toast('Tempo esgotado.');s.fim=Date.now();(async()=>{for(const id of s.ids)await registrar(mapa[id],s.resp[id]||null,s.tempos[id]||0,s.id);s.i=-1;salvar();desenhar();})();return;}const mm=Math.floor(r/60000),ss=Math.floor(r%60000/1000);el.textContent=`${mm}:${String(ss).padStart(2,'0')}`;el.style.color=r<5*60000?'var(--err)':'';};tick();App.timer=setInterval(tick,1000);}
  else if(s.modo==='simulado'&&!s.fim){const tick=()=>{const el=$('#tmr');if(el)el.textContent=fmtDur(Date.now()-s.inicio);};tick();App.timer=setInterval(tick,1000);}
  $('#qc').onclick=async e=>{
   const rc=e.target.closest('[data-risc]');if(rc){e.stopPropagation();const l=rc.dataset.risc;const arr=s.risc[q.id]||(s.risc[q.id]=[]);const k=arr.indexOf(l);if(k>=0)arr.splice(k,1);else arr.push(l);salvar();desenhar();return;}
   const ac=e.target.closest('[data-q]');if(ac){await acoesQuestao(ac.dataset.q,q,(apagada)=>{if(apagada){s.ids.splice(s.i,1);if(!s.ids.length){Sessao.clear();go('#/questoes');return;}s.i=Math.min(s.i,s.ids.length-1);salvar();}desenhar();});return;}
   const b=e.target.closest('[data-resp]');if(!b)return;
   if(s.modo==='simulado'){if(s.fim)return;s.resp[q.id]=b.dataset.resp;salvar();desenhar();return;}
   if(s.resp[q.id])return;marcaTempo();s.resp[q.id]=b.dataset.resp;salvar();
   await registrar(q,b.dataset.resp,s.tempos[q.id]||0,s.id);desenhar();
  };
 };
 s.qIni=Date.now();desenhar();
}

 main.innerHTML=`<header class="ph"><div><h1>Discursivas</h1><p class="muted">Questões dissertativas e casos práticos de segunda fase, com espelho de correção e avaliação pela IA.</p></div></header>
 <div class="card" id="fd"><h3>Nova discursiva</h3>${await fonteHTML('d')}
 <div class="grid2"><div class="field"><label>Modelo</label><select id="d-tipo"><option value="questao">Questão discursiva (dissertativa)</option><option value="caso">Caso prático com pergunta(s) direcionada(s)</option></select></div><div class="field"><label>Extensão esperada</label><select id="d-lin"><option value="15">Até 15 linhas</option><option value="30" selected>Até 30 linhas</option><option value="60">Até 60 linhas</option></select></div></div>
 <div class="row end"><button class="btn" id="d-ok">Gerar discursiva</button></div></div>
 ${ds.length?`<h3 class="gh">Suas discursivas</h3><div class="list">${ds.map(d=>`<a class="item" href="#/discursiva/${d.id}"><div><strong>${esc((d.enunciado||'').slice(0,110))}…</strong><div class="muted small">${esc(d.origem&&d.origem.rotulo||'')} · ${fmtData(d.criado)}</div></div>${d.correcao?`<span class="pill ${d.correcao.nota/d.correcao.maximo>=0.6?'ok':'warn'}">${d.correcao.nota}/${d.correcao.maximo}</span>`:'<span class="pill">a responder</span>'}</a>`).join('')}</div>`:''}`;
 const fd=$('#fd');bindFonte(fd,'d',{lei:q.get('lei'),mat:q.get('mat')});
 $('#d-ok').onclick=async()=>{
  let fonte;try{fonte=await lerFonte(fd,'d',22000);}catch(e){return toast(e.message);}
  const tipo=$('#d-tipo').value,lin=$('#d-lin').value;
  const r=await job('Elaborando discursiva',async()=>{
   const seg=fonte.segmentos[Math.floor(Math.random()*fonte.segmentos.length)];
   const schema={type:'OBJECT',properties:{enunciado:{type:'STRING'},espelho:{type:'ARRAY',items:{type:'OBJECT',properties:{item:{type:'STRING'},pontos:{type:'NUMBER'},descricao:{type:'STRING'}},required:['item','pontos','descricao']}},resposta_modelo:{type:'STRING'},fundamentos:{type:'ARRAY',items:{type:'STRING'}},depende_fonte_externa:{type:'BOOLEAN'}},required:['enunciado','espelho','resposta_modelo']};
   const x=await gemini({system:SYS_EXAMINADOR,schema,prompt:`Elabore ${tipo==='caso'?'um caso prático (narrativa com personagens e entes fictícios) seguido de pergunta(s) direcionada(s)':'uma questão discursiva (dissertativa)'} no padrão da segunda fase dos concursos da magistratura (Resolução CNJ 75/2009), para resposta em até ${lin} linhas. Monte o espelho de correção com 3 a 6 itens objetivos, pontuação total 10, cada item descrevendo exatamente o que o candidato precisa abordar. Escreva uma resposta modelo completa, em prosa dissertativa. Em "fundamentos", liste os dispositivos e trechos do texto-base usados. Não invente julgados; se a resposta exigir jurisprudência ausente do texto-base, cite-a genericamente e marque depende_fonte_externa.\n\n${seg.tema?'TEMA: '+seg.tema:`TEXTO-BASE (${seg.rotulo}):\n"""\n${seg.texto}\n"""`}`});
   const d={id:uid(),criado:Date.now(),tipo,linhas:lin,origem:fonte.origem,disciplina:fonte.disciplina,enunciado:x.enunciado,espelho:x.espelho||[],modelo:x.resposta_modelo,fundamentos:x.fundamentos||[],externa:!!x.depende_fonte_externa||!!seg.tema,resposta:'',correcao:null,base:seg.tema?'':seg.texto.slice(0,40000)};
   await DB.put('discursivas',d);return d;});
  if(r)go('#/discursiva/'+r.id);
 };
}
async function viewDiscursiva(main,id){
 const d=await DB.get('discursivas',id);if(!d){main.innerHTML=vazio('Discursiva não encontrada.');return;}
 const tot=d.espelho.reduce((s,e)=>s+(+e.pontos||0),0)||10;
 main.innerHTML=`<header class="ph"><div><a class="back" href="#/discursivas">‹ Discursivas</a><h1>Discursiva</h1><p class="muted">${esc(d.origem&&d.origem.rotulo||'')} · até ${d.linhas} linhas</p></div></header>
 <div class="card"><div class="enun">${esc(d.enunciado)}</div>${d.externa?'<p class="hint warn">Parte da resposta esperada depende de fonte externa ao texto-base: confira.</p>':''}</div>
 <div class="card"><div class="field"><label>Sua resposta</label><textarea id="resp" rows="16" class="serif">${esc(d.resposta||'')}</textarea></div><div class="row"><span class="muted small" id="ct"></span><span class="sp"></span><span class="muted small" id="sv"></span><button class="btn" id="corr">Corrigir com IA</button></div></div>
 <div id="out">${d.correcao?correcaoHTML(d.correcao):''}</div>
 <details><summary>Espelho de correção (${tot} pontos)</summary><ol>${d.espelho.map(e=>`<li><strong>${esc(e.item)}</strong> (${e.pontos} pt) — ${esc(e.descricao)}</li>`).join('')}</ol></details>
 <details><summary>Resposta modelo</summary><div class="lei-txt">${esc(d.modelo||'')}</div>${d.fundamentos.length?`<h4>Fundamentos</h4><ul>${d.fundamentos.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}</details>
 <div class="row"><button class="btn ghost sm danger" id="del">Excluir discursiva</button></div>`;
 const ta=$('#resp');const conta=()=>{const t=ta.value.trim();$('#ct').textContent=`${t?t.split(/\s+/).length:0} palavras · ~${Math.ceil(t.length/75)} linhas manuscritas`;};conta();
 let tm;ta.oninput=()=>{conta();clearTimeout(tm);tm=setTimeout(async()=>{d.resposta=ta.value;await DB.put('discursivas',d);$('#sv').textContent='salvo';},700);};
 $('#del').onclick=async()=>{if(await confirmar('Excluir','Excluir esta discursiva?','Excluir')){await DB.del('discursivas',id);go('#/discursivas');}};
 $('#corr').onclick=async()=>{
  d.resposta=ta.value;if(d.resposta.trim().length<40)return toast('Escreva a resposta antes de pedir a correção.');await DB.put('discursivas',d);
  const schema={type:'OBJECT',properties:{itens:{type:'ARRAY',items:{type:'OBJECT',properties:{item:{type:'STRING'},obtido:{type:'NUMBER'},maximo:{type:'NUMBER'},comentario:{type:'STRING'}},required:['item','obtido','maximo','comentario']}},nota:{type:'NUMBER'},maximo:{type:'NUMBER'},apreciacao:{type:'STRING'},melhorias:{type:'ARRAY',items:{type:'STRING'}},paragrafo_reescrito:{type:'STRING'}},required:['itens','nota','maximo','apreciacao']};
  const c=await job('Corrigindo',()=>gemini({schema,temperature:0.2,prompt:`Você é examinador da segunda fase de concurso da magistratura. Corrija a resposta do candidato com rigor e imparcialidade, item por item, exclusivamente segundo o ESPELHO, atribuindo a cada item nota entre 0 e o máximo (frações de 0,25 permitidas). Considere também domínio técnico, correção da linguagem jurídica, coesão e capacidade de argumentação. Aponte omissões e erros conceituais. Em "melhorias", liste ações concretas. Em "paragrafo_reescrito", reescreva o trecho mais fraco da resposta como um candidato aprovado escreveria. Não invente jurisprudência.\n\nENUNCIADO:\n${d.enunciado}\n\nESPELHO:\n${d.espelho.map((e,i)=>`${i+1}. ${e.item} (${e.pontos} pt): ${e.descricao}`).join('\n')}\n\nRESPOSTA MODELO (referência):\n${d.modelo}\n\n${d.base?`TEXTO-BASE:\n"""\n${d.base.slice(0,20000)}\n"""\n\n`:''}RESPOSTA DO CANDIDATO:\n"""\n${d.resposta}\n"""`}));
  if(c){c.maximo=c.maximo||tot;d.correcao=c;d.corrigida=Date.now();await DB.put('discursivas',d);$('#out').innerHTML=correcaoHTML(c);$('#out').scrollIntoView({behavior:'smooth'});}
 };
}
function correcaoHTML(c){return `<div class="card"><h2>Nota: ${c.nota} de ${c.maximo}</h2><p>${esc(c.apreciacao)}</p><table><tr><th>Item</th><th>Nota</th><th>Comentário</th></tr>${(c.itens||[]).map(i=>`<tr><td>${esc(i.item)}</td><td>${i.obtido}/${i.maximo}</td><td>${esc(i.comentario)}</td></tr>`).join('')}</table>${c.melhorias&&c.melhorias.length?`<h4>Como melhorar</h4><ul>${c.melhorias.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}${c.paragrafo_reescrito?`<h4>Trecho reescrito</h4><blockquote class="serif">${esc(c.paragrafo_reescrito)}</blockquote>`:''}<p class="hint">Correção automatizada: use como treino, não como nota oficial.</p></div>`;}

/* ===================== Estatísticas ===================== */
async function viewStats(main){
 const [tents,logs,cards,qs]=await Promise.all([DB.all('tentativas'),DB.all('log'),DB.all('cartoes'),DB.all('questoes')]);
 const cfg=Cfg.get();const ac=tents.filter(t=>t.acertou).length;
 const agrupar=k=>{const o={};tents.forEach(t=>{const c=t[k]||'—';const x=o[c]||(o[c]={n:0,a:0});x.n++;if(t.acertou)x.a++;});return Object.keys(o).map(c=>({c,n:o[c].n,a:o[c].a,p:pct(o[c].a,o[c].n)})).sort((a,b)=>a.p-b.p);};
 const porD=agrupar('disciplina'),porB=agrupar('banca');
 const dias=[];for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*DIA);const l=logs.find(x=>x.id===hoje(d))||{};dias.push({d:d.getDate()+'/'+(d.getMonth()+1),q:l.questoes||0,c:l.cartoes||0,a:l.acertos||0});}
 const maxQ=Math.max(1,...dias.map(x=>x.q)),maxC=Math.max(1,...dias.map(x=>x.c));
 const maduros=cards.filter(c=>cardAtivo(c)&&c.srs.interval>=21).length,ativos=cards.filter(cardAtivo).length;
 const tab=(arr,nome)=>arr.length?`<table><tr><th>${nome}</th><th>Questões</th><th>Acerto</th><th></th></tr>${arr.map(x=>`<tr><td>${esc(nome==='Banca'?((cfg.bancas[x.c]||{}).nome||x.c):x.c)}</td><td>${x.n}</td><td>${x.p}%</td><td style="width:35%"><div class="mini"><i style="width:${x.p}%;background:${x.p<60?'var(--err)':x.p<75?'var(--warn)':'var(--ok)'}"></i></div></td></tr>`).join('')}</table>`:'<p class="muted">Sem dados ainda.</p>';
 main.innerHTML=`<header class="ph"><div><h1>Estatísticas</h1><p class="muted">Ordenadas do pior para o melhor desempenho, para orientar a revisão.</p></div></header>
 <div class="grid"><div class="card"><h3>Questões resolvidas</h3><div class="kpi">${tents.length}</div><p class="muted">${pct(ac,tents.length)}% de acerto geral</p></div><div class="card"><h3>Cartões maduros</h3><div class="kpi">${maduros}/${ativos}</div><p class="muted">intervalo de 21 dias ou mais</p></div><div class="card"><h3>Banco</h3><div class="kpi">${qs.length}</div><p class="muted">${qs.filter(q=>q.verificar).length} marcadas para conferir · ${qs.filter(q=>q.sinalizada).length} sinalizadas</p></div></div>
 <div class="card"><h3>Questões por dia (30 dias)</h3><div class="bars">${dias.map(x=>`<div class="${x.q?'':'z'}" style="height:${Math.max(2,x.q/maxQ*100)}%" title="${x.d}: ${x.q} questões, ${pct(x.a,x.q)}%"></div>`).join('')}</div></div>
 <div class="card"><h3>Cartões revisados por dia (30 dias)</h3><div class="bars">${dias.map(x=>`<div class="${x.c?'':'z'}" style="height:${Math.max(2,x.c/maxC*100)}%;background:var(--gold)" title="${x.d}: ${x.c} cartões"></div>`).join('')}</div></div>
 <div class="card"><h3>Por disciplina</h3>${tab(porD,'Disciplina')}</div>
 <div class="card"><h3>Por banca</h3>${tab(porB,'Banca')}</div>`;
}

/* ===================== Ajustes ===================== */
async function viewAjustes(main){
 const cfg=Cfg.get();
 let est='';try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();const p=navigator.storage.persisted?await navigator.storage.persisted():false;est=`Uso: ${(e.usage/1048576).toFixed(1)} MB de ${(e.quota/1048576/1024).toFixed(1)} GB disponíveis · armazenamento ${p?'persistente':'não persistente (o sistema pode apagar se faltar espaço)'}`;}}catch(e){}
 const ultB=+localStorage.getItem('jm.ultBackup')||0;
 main.innerHTML=`<header class="ph"><div><h1>Ajustes</h1></div></header>
 <div class="card"><h2>IA — Google Gemini</h2>
  <div class="field"><label>Chave da API</label><div class="row" style="margin:0"><input type="password" id="ak" value="${esc(cfg.apiKey)}" placeholder="Cole aqui a chave criada no Google AI Studio" autocomplete="off" style="flex:1"><button class="btn ghost sm" id="mostra">Mostrar</button></div>
  <p class="hint">Crie a chave em <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Ela fica salva apenas neste navegador, nunca no GitHub. No Google Cloud, restrinja a chave à API Generative Language e, se quiser, ao endereço do seu site (referenciadores HTTP).</p></div>
  <div class="grid2"><div class="field"><label>Modelo</label><select id="md">${modelosOpts(cfg)}</select></div><div class="field"><label>Criatividade (temperatura): <span id="tv">${cfg.temp}</span></label><input type="range" id="tp" min="0" max="1.5" step="0.1" value="${cfg.temp}" style="width:100%"></div></div>
  <div class="row"><button class="btn" id="tst">Testar chave e listar modelos</button><span class="muted small" id="tres"></span></div>
  <p class="hint">Preferência: modelos “Flash” (rápidos e baratos) para lacunas e questões; “Pro”, se disponível na sua chave, para discursivas. O apelido “gemini-flash-latest” acompanha automaticamente a versão Flash mais recente.</p></div>
 <div class="card"><h2>Estudo</h2>
  <div class="grid2"><div class="field"><label>Seu nome (saudação)</label><input type="text" id="nm" value="${esc(cfg.nome||'')}"></div><div class="field"><label>Novos cartões por dia</label><input type="number" id="npd" value="${cfg.novosPorDia}" min="1" max="1000"></div></div>
  <label class="chk"><input type="checkbox" id="dg"${cfg.digitar?' checked':''}> Na revisão, digitar as respostas das lacunas (em vez de só revelar)</label>
  <div class="field" style="margin-top:12px"><label>Tema</label><select id="tm"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select></div>
  <div class="field"><label>Disciplinas (uma por linha)</label><textarea id="ds" rows="6">${esc(cfg.disciplinas.join('\n'))}</textarea></div>
  <div class="row end"><button class="btn" id="salvar">Salvar</button></div></div>
 <div class="card"><h2>Perfis das bancas</h2><p class="muted small">Estes textos orientam a IA. Para aproximar ainda mais o estilo, cole em “Exemplos reais” duas ou três questões verdadeiras da banca (por exemplo, dos seus cadernos do QConcursos); a IA imita a redação sem copiar o conteúdo.</p>
  ${Object.keys(cfg.bancas).map(b=>`<details><summary>${esc(cfg.bancas[b].nome)}</summary><div class="field"><label>Perfil</label><textarea rows="8" data-perfil="${b}">${esc(cfg.bancas[b].perfil)}</textarea></div><div class="field"><label>Exemplos reais (opcional)</label><textarea rows="6" data-ex="${b}" placeholder="Cole questões reais desta banca">${esc(cfg.bancas[b].exemplos||'')}</textarea></div><div class="row"><button class="btn ghost sm" data-rest="${b}">Restaurar perfil padrão</button></div></details>`).join('')}
  <div class="row end"><button class="btn" id="salvarB">Salvar perfis</button></div></div>
 <div class="card"><h2>Backup e dados</h2><p class="muted small">${esc(est)}</p><p class="muted small">Último backup: ${ultB?fmtData(ultB):'nunca'}. Os dados não sincronizam sozinhos entre aparelhos: exporte aqui e importe no outro (celular, tablet ou computador).</p>
  <div class="row"><button class="btn" id="exp">Exportar backup (.json)</button><label class="btn ghost">Importar backup<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn ghost danger" id="zera">Apagar tudo</button></div></div>
 <div class="card"><h2>Instalar no iPhone e no iPad</h2><p class="small">No Safari, abra o endereço do site, toque em Compartilhar e escolha “Adicionar à Tela de Início”. O app abre em tela cheia e funciona sem internet para revisar; a IA exige conexão.</p><p class="hint">Versão ${APP_VER}.</p></div>`;
 $('#tm').value=cfg.tema||'auto';
 $('#mostra').onclick=()=>{const i=$('#ak');i.type=i.type==='password'?'text':'password';};
 $('#tp').oninput=e=>$('#tv').textContent=e.target.value;
 $('#tst').onclick=async()=>{const k=$('#ak').value.trim();if(!k)return toast('Cole a chave primeiro.');$('#tres').textContent='Testando…';
  try{const ms=await listarModelos(k);cfg.apiKey=k;cfg.modelos=ms;if(!ms.some(m=>m.id===cfg.model)&&cfg.model!=='gemini-flash-latest'){const f=ms.find(m=>/flash/i.test(m.id)&&!/lite/i.test(m.id))||ms[0];if(f)cfg.model=f.id;}Cfg.save();$('#md').innerHTML=modelosOpts(cfg);$('#tres').textContent=`Chave válida · ${ms.length} modelos disponíveis.`;}
  catch(e){$('#tres').textContent='Falhou: '+e.message;}};
 $('#salvar').onclick=()=>{cfg.apiKey=$('#ak').value.trim();cfg.model=$('#md').value;cfg.temp=+$('#tp').value;cfg.nome=$('#nm').value.trim();cfg.novosPorDia=Math.max(1,+$('#npd').value||30);cfg.digitar=$('#dg').checked;cfg.tema=$('#tm').value;const ds=$('#ds').value.split('\n').map(s=>s.trim()).filter(Boolean);cfg.disciplinas=ds.length?ds:DISC_PADRAO.slice();Cfg.save();aplicarTema();toast('Ajustes salvos.');};
 $('#md').onchange=()=>{cfg.model=$('#md').value;Cfg.save();toast('Modelo: '+cfg.model);};
 $('#salvarB').onclick=()=>{$$('[data-perfil]').forEach(t=>cfg.bancas[t.dataset.perfil].perfil=t.value);$$('[data-ex]').forEach(t=>cfg.bancas[t.dataset.ex].exemplos=t.value);Cfg.save();toast('Perfis salvos.');};
 $$('[data-rest]').forEach(b=>b.onclick=()=>{const k=b.dataset.rest;$(`[data-perfil="${k}"]`).value=BANCAS_PADRAO[k].perfil;});
 $('#exp').onclick=exportar;
 $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;await importar(f);e.target.value='';render();};
 $('#zera').onclick=async()=>{if(!(await confirmar('Apagar tudo','Remove todas as leis, materiais, questões, revisões e estatísticas deste aparelho. A chave da API e os ajustes permanecem. Faça um backup antes.','Apagar tudo')))return;for(const s of DB.stores)await DB.clear(s);Sessao.clear();toast('Dados apagados.');go('#/');};
}
function modelosOpts(cfg){const ms=(cfg.modelos||[]).slice();if(!ms.some(m=>m.id==='gemini-flash-latest'))ms.unshift({id:'gemini-flash-latest',nome:'Gemini Flash (sempre o mais recente)'});if(cfg.model&&!ms.some(m=>m.id===cfg.model))ms.unshift({id:cfg.model,nome:cfg.model});return ms.map(m=>`<option value="${esc(m.id)}"${m.id===cfg.model?' selected':''}>${esc(m.nome)} — ${esc(m.id)}</option>`).join('');}
async function exportar(){
 const cfg=JSON.parse(JSON.stringify(Cfg.get()));delete cfg.apiKey;
 const out={app:'juris-memoria',versao:APP_VER,criado:new Date().toISOString(),cfg,dados:{}};
 for(const s of DB.stores){const arr=await DB.all(s);out.dados[s]=s==='textos'?arr.map(t=>({id:t.id,paginas:t.paginas})):arr;}
 baixar('juris-memoria-backup-'+hoje()+'.json',JSON.stringify(out),'application/json');
 localStorage.setItem('jm.ultBackup',Date.now());toast('Backup exportado.');
}
async function importar(f){
 let o;try{o=JSON.parse(await f.text());}catch(e){return alertModal('Arquivo inválido','Não foi possível ler o backup.');}
 if(o.app!=='juris-memoria'||!o.dados)return alertModal('Arquivo inválido','Este arquivo não é um backup do Juris Memória.');
 if(!(await confirmar('Importar backup',`Backup de ${fmtData(o.criado)}. Os itens serão mesclados aos atuais (itens com o mesmo identificador são substituídos pela versão do backup).`,'Importar')))return;
 await job('Importando',async ctx=>{const ss=Object.keys(o.dados).filter(s=>DB.stores.includes(s));for(let i=0;i<ss.length;i++){ctx.progress(i/ss.length,'Importando '+ss[i]+'…');await DB.putMany(ss[i],o.dados[ss[i]]||[]);}
  if(o.cfg){const c=Cfg.get();const k=c.apiKey;Object.assign(c,o.cfg,{apiKey:k});for(const b in BANCAS_PADRAO)c.bancas[b]=Object.assign({},BANCAS_PADRAO[b],c.bancas[b]||{});Cfg.save();aplicarTema();}});
 toast('Backup importado.');
}

/* ===================== inicialização ===================== */
const ROTAS={'':viewInicio,leis:viewLeis,lei:viewLei,materiais:viewMateriais,material:viewMaterial,revisar:viewRevisar,questoes:viewQuestoes,gerar:viewGerar,resolver:viewResolver,discursivas:viewDiscursivas,discursiva:viewDiscursiva,stats:viewStats,ajustes:viewAjustes};
$('#mais').onclick=()=>{const w=modal(`<h3>Mais</h3><div class="list">${[['#/materiais','Materiais'],['#/gerar','Gerar questões'],['#/discursivas','Discursivas'],['#/stats','Estatísticas'],['#/ajustes','Ajustes']].map(([h,t])=>`<a class="item" href="${h}">${t}</a>`).join('')}</div>`);$$('a',w).forEach(a=>a.addEventListener('click',()=>w.remove()));};
window.addEventListener('hashchange',render);
(async()=>{
 aplicarTema();$('#ver').textContent='Versão '+APP_VER;
 if(!window.indexedDB){$('#main').innerHTML='<div class="card">Este navegador não oferece armazenamento local (IndexedDB). Em navegação privada do Safari, abra em uma aba normal.</div>';return;}
 try{await DB.open();}catch(e){$('#main').innerHTML='<div class="card">Não foi possível abrir o banco local: '+esc(e.message)+'</div>';return;}
 render();
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
